services:
  - type: web
    name: cognito-backend
    runtime: node
    plan: free
    buildCommand: npm install && cd server && npm install
    startCommand: cd server && node seed.js && node index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: JWT_SECRET
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: "*"
